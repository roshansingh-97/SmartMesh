[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor Speed
monitor_speed = 115200

; Library Dependencies (Auto-downloaded by PlatformIO)
lib_deps =
    painlessmesh/painlessMesh
    bblanchon/ArduinoJson
    arkhipenko/TaskScheduler
    me-no-dev/AsyncTCP
    Keypad
    olikraus/U8g2@^2.35.8

; Compiler Flags for Subfolder Includes
build_flags = 
    -I src
    -I src/Input
    -I src/UI
    -I src/Radio